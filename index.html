<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인생 현장실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 휴대폰 한 줄 컬럼. 회색 배경 위 흰 카드, 아래쪽에 큰 선택 버튼 */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --sub:#6E6E73;
  --accent:#007AFF; --sep:rgba(60,60,67,.16); --fill:#E9E9EF;
  --good:#248A3D; --bad:#D70015; --warn:#C93400;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --text:#F2F2F7; --sub:#98989F;
    --accent:#0A84FF; --sep:rgba(84,84,88,.55); --fill:#2C2C2E;
    --good:#30D158; --bad:#FF6961; --warn:#FF9F0A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --text:#F2F2F7; --sub:#98989F;
  --accent:#0A84FF; --sep:rgba(84,84,88,.55); --fill:#2C2C2E;
  --good:#30D158; --bad:#FF6961; --warn:#FF9F0A; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:520px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:30px;line-height:1.2;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.lab{font-size:13px;color:var(--sub);font-weight:500;margin:0 4px}
.sub{color:var(--sub);font-size:15px;margin:0}
.card{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.group > *{padding:12px 16px}
.group > * + *{border-top:.5px solid var(--sep)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:17px;text-align:center}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn:active{opacity:.75}
.choice{display:flex;flex-direction:column;gap:2px;width:100%;background:var(--card);border-radius:14px;padding:14px 16px;font-weight:500;color:var(--accent)}
.choice small{color:var(--sub);font-weight:400;font-size:13px}
.choice:active{background:var(--fill)}
.choices{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px}
.seg button{padding:7px 0;border-radius:7px;text-align:center;font-size:15px}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:700}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%}
.opt .ck{color:var(--accent);font-weight:700;visibility:hidden}
.opt[aria-checked="true"] .ck{visibility:visible}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.stat span{font-size:12px;color:var(--sub)}
.stat b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:4px;border-radius:2px;background:var(--fill);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.hot i{background:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .t{font-size:20px;font-weight:700}
.link{color:var(--accent);font-size:15px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--fill);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);margin:2px 4px 2px 0}
.ev{font-size:18px;line-height:1.5;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.src{font-size:12px;color:var(--sub)}
.src a{color:var(--accent);text-decoration:none}
.log{font-size:14px;max-height:360px;overflow-y:auto}
.log div{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-top:.5px solid var(--sep)}
.log div:first-child{border-top:0}
.log span{color:var(--sub);font-variant-numeric:tabular-nums}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dex div{background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.dex div.off{color:var(--sub);font-weight:400}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
/* 투자 시트 */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.on{display:flex}
#sheet .pane{background:var(--bg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
#sheet .pane > *{flex-shrink:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{appearance:none;-webkit-appearance:none;margin:0;width:51px;height:31px;border-radius:16px;background:var(--fill);cursor:pointer;transition:background .2s}
.sw input:checked{background:var(--good)}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked::after{transform:translateX(20px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.rep{display:grid;grid-template-columns:1.6fr .8fr .9fr .9fr;gap:6px 8px;font-size:14px;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:10px;padding:10px 12px}
.rep > span:nth-child(-n+4){color:var(--sub);font-size:12px}
.choice.locked{opacity:.5;color:var(--sub);cursor:not-allowed}.choice.locked:active{background:var(--card)}
.scene{margin:0;border-radius:16px;overflow:hidden;background:var(--card)}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:360/150}
.scene figcaption{font-size:13px;color:var(--sub);padding:8px 14px}
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1.5px)}}
.drift{animation:drift 46s linear infinite}@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(420px)}}
.fall{animation:fall 8s linear infinite}@keyframes fall{from{transform:translate(0,0)}to{transform:translate(-24px,170px)}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{opacity:.55;transform:scale(1.08)}}
.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.7}}
.spin{animation:spin 3s linear infinite}.tick{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.4s ease-out infinite}@keyframes rise{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}
.wave{animation:wave 3s ease-in-out infinite}@keyframes wave{50%{transform:translateX(-12px)}}
.bounce{animation:bounce 1.1s ease-in-out infinite}@keyframes bounce{50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
@media (prefers-color-scheme:dark){.scene svg{filter:brightness(.86) saturate(.92)}}
.cc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.cc .chip{font-size:12px;padding:2px 8px;white-space:normal}
.chip.star{color:#9a6400;background:rgba(255,204,0,.2)}.chip.fix{color:var(--accent)}
@media (prefers-color-scheme:dark){.chip.star{color:#ffd60a}}
.cmp{display:grid;grid-template-columns:.7fr 1.15fr 1.15fr;gap:8px 8px;font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px;word-break:keep-all}
.cmp > span:nth-child(-n+3){color:var(--sub);font-size:12px}
.rep .g1,.rep .g2{color:var(--good);font-weight:700}.rep .g5{color:var(--bad)}
</style>
</head>

/* ===== 학과 맞춤 계산 문제: 숫자가 매번 바뀐다 ===== */
const RI=(a,b)=>a+Math.floor(rnd()*(b-a+1)),RP=a=>a[Math.floor(rnd()*a.length)],cm=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function mq(q,a,ws,e,u=''){const A=String(a)+u,seen=new Set([A]),w=[];
  for(const x of ws){const s=String(x)+u;if(!seen.has(s)&&!/^-|NaN/.test(s)){seen.add(s);w.push(s);}if(w.length===3)break;}
  let k=1;while(w.length<3){const s=String(Number(a)+k*(Number(a)>20?10:1))+u;if(!seen.has(s)){seen.add(s);w.push(s);}k++;}
  return {q,a:A,w,e};}

/* ===== 정기시험: 기말고사 3문제 (네 과목 중 무작위 3개) ===== */
const SUBS=['kor','mat','eng','maj'],SUBN={kor:'국어',mat:'수학',eng:'영어'};
const subName=s=>SUBN[s]||MAJOR[S.dept];
function qPick(s){
  let x;
  if(s==='mat'){const g=RP(MATHQ.c.concat(MATHQ[S.dept]));x=g();}
  else{const all=(QB[s].c||[]).concat(QB[s][S.dept]||[]);let pool=all.filter(q=>!S.qseen.includes(q[0]));if(!pool.length)pool=all;
    const q=RP(pool);S.qseen.push(q[0]);x={q:q[0],a:q[1],w:q.slice(2,5),e:q[5]};}
  const opts=[x.a,...x.w];for(let i=opts.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return {s,q:x.q,opts,ans:opts.indexOf(x.a),e:x.e,ok:null};
}
function startExam(){
  const subs=SUBS.slice();subs.splice(Math.floor(rnd()*4),1);
  S.ex={qs:subs.map(qPick),i:0};
  return `시험지를 받았어요. ${subs.map(subName).join('·')} 3문제예요.`;
}
function exCard(){const q=S.ex.qs[S.ex.i];return {ex:true,free:true,text:q.q,ch:q.opts.map(t=>({t}))};}
function answerEx(i){
  const q=S.ex.qs[S.ex.i];q.ok=i===q.ans;S.ex.i++;
  S.log.push([S.slot,`기말고사 ${subName(q.s)} 문제 ${q.ok?'정답':'오답'}`]);
  S.result={q:`기말고사 ${subName(q.s)} 문제`,t:q.opts[i],text:(q.ok?'정답이에요! ':`틀렸어요. 정답은 "${q.opts[q.ans]}"예요. `)+q.e,chips:[{t:q.ok?'정답':'오답',good:q.ok}]};
  S.screen='result';
}

const SKIN='#F5CFAE';
function season(){const c=CAL[S.slot]||{};const m=c.mo||'';
  if(c.h)return c.h===1?'spring':'autumn';
  if(/겨울|12월|1월|2월|11월/.test(m))return /11월/.test(m)?'autumn':'winter';
  if(/여름|6월|7월|8월/.test(m))return 'summer';
  if(/9월|10월/.test(m))return 'autumn';return 'spring';}

  S.hs.reports.push({sem:S.sem,avg});
  S.grades=Math.round(clamp(S.grades*.6+(100-(avg-1)*20)*.4));
  const why=[...qs.map(q=>({t:`${subName(q.s)} 문제 ${q.ok?'정답':'오답'}`,good:q.ok})),{t:prep>=3?'시험 준비 충분':prep>=1?'시험 준비 조금':'시험 준비 안 함',good:prep>=1},
    {t:`원래 학업 실력 ${S.grades>=60?'좋음':'보통 이하'}`,good:S.grades>=60},{t:`전공 실습 역량 ${S.skill}`,good:S.skill>=45}];
  if(hAdj)why.push({t:`건강 ${Math.round(S.health)}`,good:hAdj>0});
  if(sAdj)why.push({t:'스트레스 높음',good:false});
  if(lAdj)why.push({t:lAdj>0?'성실한 출결':`지각·결과 ${S.hs.late}회`,good:lAdj>0});
  S.hs.study=0;S._report={rows,avg,why};
  return `성적표가 나왔어요. 이번 학기 평균 ${avg.toFixed(1)}등급이에요.`;
}

function draw(){

  if(pool.length>1)pool=pool.filter(c=>c.id!==S.cur);
  if(!pool.length)return S.y===4?'ac_health':'n_praise';
  const c=pickW(pool,c=>typeof c.w==='function'?c.w(S):(c.w||(c.line?3:2)));
  if(!S.used.includes(c.id))S.used.push(c.id);

}
function drawSlot(){
  if(S.y===4){const A=S.af,c=CAL[S.slot];
    if(A.inArmy&&A.armyQ.length)return A.armyQ.shift();
    if(S.gender==='m'&&!A.armyDone&&!A.inArmy&&c.h===1&&S.ay>=A.draftAy)return 'aa_draft';
    if(CAL[S.slot].fix[S.k-1]==='af_start')return 'af_start_'+S.track;}

const LABEL={skill:'역량',grades:'학업',health:'건강',stress:'스트레스',cash:'용돈',late:'지각·결과',cprep:'대회 연습',study:'시험 준비'};
function applyFx(fx){
  const chips=[];let txt='';if(!fx)return {chips,txt};
  for(const k in fx){
    let v=val(fx[k]);
    if(k==='flag'){for(const f of [].concat(v)){if(TRAITS[f]&&!S.flags[f])chips.push({t:'특성 획득 · '+TRAITS[f],good:true});S.flags[f]=1;}continue;}
    if(k==='act'){const t=ACTS[v]();if(t)txt+=(txt?' ':'')+t;continue;}
    if(k==='cert'){const n=v==='next'?nextCert():v;
      if(n&&!S.hs.certs.includes(n)){S.hs.certs.push(n);S.certs=S.hs.certs.length;chips.push({t:'자격증 · '+n,good:true});}continue;}
    if(k==='cert2'){const n=nextCert2();if(n){S.af.certs.push(n);S.certs++;S.af.got.push(n+' 취득');chips.push({t:'자격증 · '+n,good:true});}continue;}
    if(k==='award'){S.hs.awards.push(v);chips.push({t:'수상 · '+v,good:true});continue;}
    if(!v)continue;
    if(k==='cash')S.cash+=v;
    else if(k==='late')S.hs.late+=v;
    else if(k==='cprep')S.hs.cprep+=v;
    else if(k==='study')S.hs.study+=v;
    else if(k==='skill'&&v>0){v=Math.max(1,Math.round(v*clamp(1.15-S.skill/100,.15,1)));S.skill=clamp(S.skill+v);}
    else S[k]=clamp(S[k]+v);
    const good=k==='stress'||k==='late'?v<0:v>0;
    chips.push({t:`${LABEL[k]} ${v>0?'+':''}${k==='cash'?fmt(v):v}`,good});
  }
  return {chips,txt};
}

function contest(level,risk){
  const C=CONTEST[S.dept];
  const base=.5*S.skill/100+.08*S.hs.cprep-(S.health<50?.06:0);
  const sc=risk?base+.85*rnd()-.18:base+.45*rnd();
  const rank=(th,names)=>{for(let i=0;i<th.length;i++)if(sc>=th[i])return names[i];return null;};
  if(level==='loc'){
    S.flags.localDone=1;
    const r=rank([.85,.75,.65,.55],['금상','은상','동상','장려상']);
    if(!r){S.skill=clamp(S.skill+4);return `${C.loc} ${C.ev}에서 아쉽게 입상하지 못했어요. 그래도 대회 경험은 큰 자산이에요.`;}
    const m=`${C.loc} ${C.ev} ${r}`;S.hs.medals.push(m);S.skill=clamp(S.skill+6);
    if(r==='금상'||r==='은상'){S.flags.natQual=1;S.hs.cprep=Math.max(0,S.hs.cprep-1);return `${m}! 전국대회 출전권을 땄어요.`;}
    return `${m}을 받았어요!`;
  }
  S.flags.natDone=1;
  const r=rank([1,.92,.84,.74],['금메달','은메달','동메달','우수상']);
  if(!r){S.skill=clamp(S.skill+5);return `${C.nat}에서 입상은 못 했지만, 전국대회 출전 자체가 큰 경력이에요.`;}
  const m=`${C.nat} ${C.ev} ${r}`;S.hs.medals.push(m);S.skill=clamp(S.skill+8);
  if(r==='금메달'){
    if(['mech','it','design','cook'].includes(S.dept)&&rnd()<.5){S.flags.natTeam=1;S.offers.push({route:'nat',name:'국제기능올림픽 국가대표 + 후원 기업 입사'});return `${m}! 전국 1위에 이어 국제기능올림픽 국가대표로 선발됐어요.`;}
    return `${m}! 전국 1위예요.`;
  }
  return `${m}을 땄어요!`;
}

function ivPick(kind){
  const n={major:3,big:3,sme:2,bank:3,special:2,sw:2,uni:3,pub:3}[kind];
  const pool=IVQ.filter(q=>(q.k.includes(kind)||q.k.includes(GROUP[kind]))&&(!q.dept||q.dept===S.dept)&&(!q.when||q.when(S)));
  const out=[];
  if(kind!=='pub'&&kind!=='uni'){const d=pool.filter(q=>q.dept);if(d.length)out.push(d[Math.floor(rnd()*d.length)].id);}
  const own=pool.filter(q=>q.k.includes(kind)&&!q.dept&&kind!=='pub');
  if(own.length)out.push(pickW(own,q=>q.w||1).id);
  while(out.length<n){const rest=pool.filter(q=>!q.dept&&!out.includes(q.id));if(!rest.length)break;out.push(pickW(rest,q=>q.w||(q.when?3:1)).id);}
  const li=out.indexOf('q_last');if(li>=0){out.splice(li,1);out.push('q_last');}
  return out;
}
function startIV(kind){S.iv={kind,qs:ivPick(kind),i:0,score:S.flags.ivPrep?.04:0,order:[],style:pickW(['evi','att','fit'],()=>1)};}
function ivAnswers(){const q=IVQ.find(x=>x.id===S.iv.qs[S.iv.i]);return {q,ans:q.a.filter(a=>!a.if||a.if(S))};}
function ivShuffle(){const n=ivAnswers().ans.length;const o=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[o[i],o[j]]=[o[j],o[i]];}S.iv.order=o;}
function ivCard(){const {q,ans}=ivAnswers();return {iv:true,text:val(q.q),ch:S.iv.order.map(i=>({t:val(ans[i].t),a:ans[i],if:ans[i].if,why:ans[i].why}))};}
function resolveIV(){
  const iv=S.iv,app=S.ivApp,a=APP[app.key];S.iv=null;S.ivApp=null;
  const p=clamp(val(a.base)-(fitOK(a)?0:.1)-(S.health<50?.06:0)+iv.score,.05,.95),ok=rnd()<p;
  if(ok)S.offers.push({route:a.route,name:app.name});
  const t=ok?`최종 합격! ${app.name} 합격 통지를 받았어요.`:`최종 불합격이에요. ${app.name} 면접에서 아쉽게 떨어졌어요.`;
  S.result={q:`${IVNAME[iv.kind]} 면접 결과`,t:`면접 점수 ${iv.score>=0?'+':''}${Math.round(iv.score*100)}점, 최종 합격 확률 약 ${pct(p)}%`,text:t,chips:[{t:ok?'합격':'불합격',good:ok}]};
  S.log.push([S.slot,`${IVNAME[iv.kind]} 면접 ${ok?'합격':'불합격'} (${app.name})`]);
}

/* 최소 기준: 넘지 못하면 선택지가 잠긴다 */
const REQ={pub:{grade:3,late:5},civil:{grade:3,late:5},bank:{grade:2.5,certs:1},major:{skill:45,certs:1},big:{skill:50,certs:1,health:50},nco:{health:60},uni4:{grade:3},abroad:{certs:1}};
const ACT_REQ={ap_pub:'pub',ap_civil:'civil',ap_bank:'bank',ap_major:'major',ap_majorAway:'major',ap_big:'big',ap_nco:'nco',ap_uni4:'uni4',ap_both:'uni4',ap_abroad:'abroad'};
function reqFail(ch){const q=ch.req||REQ[ACT_REQ[ch.act]];if(!q)return [];const out=[];
  if(q.skill&&S.skill<q.skill)out.push(`역량 부족 (현재 ${S.skill} / 기준 ${q.skill})`);
  if(q.grade){const g=S.hs.reports.length?avgGrade():5;if(g>q.grade)out.push(`내신 부족 (현재 ${S.hs.reports.length?g.toFixed(1):'-'}등급 / 기준 ${q.grade.toFixed(1)}등급 이내)`);}
  if(q.certs&&S.certs<q.certs)out.push(`자격증 부족 (현재 ${S.certs}개 / 기준 ${q.certs}개)`);
  if(q.health&&S.health<q.health)out.push(`건강 부족 (현재 ${Math.round(S.health)} / 기준 ${q.health})`);
  if(q.late!==undefined&&S.hs.late>q.late)out.push(`출결 부족 (지각·결과 ${S.hs.late}회 / 기준 ${q.late}회 이하)`);
  return out;}
const locked=ch=>reqFail(ch).length>0;
const canDice=c=>!c.free&&visible(c).filter(x=>!x.nodice&&!locked(x)).length>=2;
/* 주사위 보정: 유리(▲)·불리(▼) 근거를 함께 돌려준다 */
function factors(ch){
  const P=[],C=[];let b=0;const up=(t,v)=>{P.push(t);b+=v;},dn=(t,v)=>{C.push(t);b-=v;};
  if(ch.if)up(`${ch.why||'특성'} 덕분`,.8);
  if(ch.a){
    if(S.flags.ivPrep)up('면접 준비',.6);
    if(S.stress>=60)dn('긴장(스트레스 높음)',S.stress/150);
    if(S.health<50)dn(`건강 ${Math.round(S.health)}`,.3);
    return {b:clamp(b,-1.2,2.5),P,C};}
  const fx=Object.assign({},ch.fx||{},ch.roll?ch.roll.ok:{});const num=k=>typeof fx[k]==='number'?fx[k]:0;
  const study=num('grades')>0||num('study')>0,work=num('skill')>0||fx.cert||fx.cprep||fx.cert2,cont=!!fx.cprep||/contest/.test(ch.act||'');
  if(study){const g=S.hs.reports.length?avgGrade():null;
    if(g!==null&&g<=2.3)up(`내신 ${g.toFixed(1)}등급`,.5);else if(g!==null&&g>=3.7)dn(`내신 ${g.toFixed(1)}등급`,.3);
    else if(g===null&&S.grades>=67)up('중3 성적 상위권',.3);
    if(S.hs.late<=1&&S.y>0)up('성실한 출결',.3);else if(S.hs.late>=5)dn(`지각·결과 ${S.hs.late}회`,.3);}
  if(work){
    if(S.skill>=60)up(`역량 ${S.skill}`,.4);else if(S.skill<30)dn(`역량 ${S.skill}`,.2);
    const nc=S.certs;if(nc)up(`자격증 ${nc}개`,.15*Math.min(nc,4));}
  if(cont&&S.hs.medals.length)up(`수상 ${S.hs.medals.length}회`,.4);
  if(study||work||num('health')<0){if(S.health<50)dn(`건강 ${Math.round(S.health)}`,.4);else if(S.health>=85)up('컨디션 좋음',.2);}
  if(num('health')>0&&S.flags.healthy)up('운동 습관',.6);
  if(num('cash')>0&&S.flags.saver)up('돈 관리 습관',.4);
  if(num('stress')>0&&S.stress>=60)dn('스트레스 높음',S.stress/120);
  if(num('stress')<0&&S.stress>=60)up('지쳐서 쉬고 싶은 마음',.4);
  if(ch.bonus){const v=val(ch.bonus);if(v)up('중3 성적',v);}
  return {b:clamp(b,-1.2,2.5),P,C};
}
function bonusOf(ch){return factors(ch).b;}
function diceProbs(c,i){const v=visible(c);const ws=v.map((ch,j)=>ch.nodice||locked(ch)?0:j===i?Math.max(.8,2+bonusOf(ch)):1);const t=ws.reduce((a,b)=>a+b,0);return ws.map(w=>w/t);}
function choose(i){
  const c=cardOf(S.cur),vis=visible(c);if(!vis[i]||locked(vis[i]))return;
  let dice=null,j=i;
  if(canDice(c)&&!vis[i].nodice){const p=diceProbs(c,i);let r=rnd();j=p.length-1;for(let k=0;k<p.length;k++){r-=p[k];if(r<=0){j=k;break;}}dice={want:val(vis[i].t),p:p[i],same:i===j};}
  if(c.ex){answerEx(i);return;}
  const ch=vis[j];
  if(ch.go){finish(ch.go);return;}
  if(c.iv){
    const a=ch.a;S.iv.i++;
    const sv=val(a.s)+(a.k&&a.k===S.iv.style?.05:0)+(rnd()-.5)*.04;S.iv.score+=sv;
    const tag=sv>=.1?'좋은 답':sv>=0?'무난한 답':'아쉬운 답';
    S.log.push([S.slot,`면접 "${c.text}" → ${ch.t}`]);
    S.result={q:c.text,t:ch.t,text:(dice&&!dice.same?'긴장해서 준비한 답과 다른 말이 나왔어요. ':'')+a.fb+(a.k&&a.k===S.iv.style?' 면접관 성향과도 잘 맞았어요.':''),chips:[{t:'면접관 반응 · '+tag,good:sv>=0}],dice};
    S.screen='result';return;
  }
  let text=val(ch.res)||'';const chips=[];
  const a=applyFx(ch.fx);chips.push(...a.chips);if(a.txt)text=a.txt+(text?' '+text:'');
  if(ch.roll){const ok=rnd()<clamp(val(ch.roll.p),0,1);const b=applyFx(ok?ch.roll.ok:ch.roll.no);chips.push(...b.chips);
    text=[val(ok?ch.roll.okT:ch.roll.noT),b.txt].filter(Boolean).join(' ');}
  if(ch.act){const t=ACTS[ch.act]();if(t)text=(text?text+' ':'')+t;}
  S.log.push([S.slot,ch.t+' → '+(text||'')]);
  S.result={q:val(c.text),t:val(ch.t),text,chips,dice,report:S._report||null};S._report=null;S.screen='result';
}
function next(){
  if(S.done){S.screen='ending';return;}
  if(S.ex){
    if(S.ex.i<S.ex.qs.length){S.cur='EX';S.screen='card';return;}
    const ex=S.ex;S.ex=null;const t=makeReport(ex);S.result={q:'기말고사',t:'성적표',text:t,chips:[],report:S._report};S._report=null;S.screen='result';return;
  }
  if(S.iv){
    if(S.iv.i<S.iv.qs.length){ivShuffle();S.cur='IV';S.screen='card';return;}
    resolveIV();S.screen='result';return;
  }
  if(S.k<CAL[S.slot].n)S.k++;
  else{
    const prev=CAL[S.slot];if(prev.y===4)afterTick(prev);
    S.slot++;S.k=1;
    if(S.slot>lastSlot()){S.done=true;if(!extOK())S.age++;S.screen='ending';return;}
    const c=CAL[S.slot];

  }
  S.cur=drawSlot();S.screen='card';
}

function vCard(){
  const c=cardOf(S.cur);
  const tag=c.ex?`<span class="tag">기말고사 ${S.ex.i+1}/3 · ${esc(subName(S.ex.qs[S.ex.i].s))}</span>`:c.iv?`<span class="tag">${IVNAME[S.iv.kind]} 면접 ${S.iv.i+1}/${S.iv.qs.length}</span>`:S.cur.startsWith('a_')?'<span class="tag">지원 시즌</span>':S.cur==='GRAD'?'<span class="tag">졸업</span>':S.cur.startsWith('p_')?'<span class="tag">원서 상담</span>':S.cur==='aj_dual'?'<span class="tag">재직자 특별전형</span>':S.cur.startsWith('aa_')?'<span class="tag">병역</span>':'';
  const who=c.iv?`<p class="sub" style="margin:0">${S.iv.i===0?esc(STYLE[S.iv.style])+' ':''}면접관이 묻습니다.</p>`:'';
  const dz=canDice(c);
  const pre=S.cur==='GRAD'?resume():'';
  const note=c.ex?'<p class="src" style="margin:0 4px">📝 지식 문제라 주사위 없이 고른 답으로 채점돼요. 맞히면 그 과목 점수가 크게 올라요.</p>':dz?`<p class="src" style="margin:0 4px">🎲 주사위 방식이에요. 선택 확률은 고른 선택지가 실제로 일어날 확률이에요. <span style="color:var(--good)">▲ 유리</span>한 조건은 확률을 올리고 <span style="color:var(--bad)">▼ 불리</span>한 조건은 내려요. ⭐는 특성 덕분에 생긴 선택지예요.${visible(c).some(locked)?' 🔒 최소 기준을 넘지 못한 선택지는 고를 수 없어요.':''}</p>`
    :`<p class="src" style="margin:0 4px">${c.free?'🎯 중요한 선택이라 주사위 없이 고른 그대로 돼요.':'🎯 고를 수 있는 선택지가 하나뿐이라 그대로 돼요.'}${visible(c).some(locked)?' 🔒 최소 기준을 넘지 못한 선택지는 고를 수 없어요.':''}</p>`;
  return `${header()}${sceneSVG()}<div class="card">${tag?`<div>${tag}</div>`:''}${who}<p class="ev">${esc(val(c.text))}</p></div>${pre}${note}
  <div class="choices">${visible(c).map((ch,i)=>{
    const lk=reqFail(ch),f=dz&&!ch.nodice&&!lk.length?factors(ch):null,mine=`${ch.why||'특성'} 덕분`,cs=[];
    lk.forEach(t=>cs.push(`<span class="chip down">🔒 ${esc(t)}</span>`));
    if(ch.if)cs.push(`<span class="chip star">⭐ ${esc(mine)}</span>`);
    if(!c.ex&&!dz&&!ch.nodice&&!lk.length)cs.push('<span class="chip fix">🎯 그대로 선택돼요</span>');
    if(ch.nodice)cs.push('<span class="chip">🎲 무작위</span>');
    if(f){f.P.filter(t=>t!==mine).forEach(t=>cs.push(`<span class="chip up">▲ ${esc(t)}</span>`));f.C.forEach(t=>cs.push(`<span class="chip down">▼ ${esc(t)}</span>`));}
    const h=[f?`선택 확률 ${pct(diceProbs(c,i)[i])}%`:'',!c.iv&&ch.hint?ch.hint(S):'',!c.iv&&ch.roll?`성공 확률 약 ${pct(val(ch.roll.p))}%`:''].filter(Boolean).join(' · ');
    return `<button class="choice${lk.length?' locked':''}" data-a="choose" data-v="${i}"${lk.length?' disabled aria-disabled="true"':''}>${ch.if?'⭐ ':''}${esc(val(ch.t))}${h?`<small>${esc(h)}</small>`:''}${cs.length?`<span class="cc">${cs.join('')}</span>`:''}</button>`;}).join('')}</div>`;
}
function vResult(){
  const r=S.result;
  const last=S.k>=CAL[S.slot].n;
  const nx=S.ex?(S.ex.i<S.ex.qs.length?'다음 문제':'성적표 받기'):S.iv?(S.iv.i<S.iv.qs.length?'다음 질문':'면접 결과 보기'):last?(S.slot>=lastSlot()?(extOK()?'6년 6개월 뒤 내 모습 보기':'5년 뒤 내 모습 보기'):S.slot===0?'특성화고 입학':`${slotName(S.slot+1)}로`):'다음';
  const dz=r.dice?`<p class="src" style="margin:0">내가 고른 것: ${esc(r.dice.want)} (선택 확률 ${pct(r.dice.p)}%)${r.dice.same?' → 그대로 됐어요':' → 주사위 결과는 달랐어요'}</p>`:'';
  const rp=r.report?`<div class="rep"><span>과목</span><span>점수</span><span>성취도</span><span>등급</span>${r.report.rows.map(x=>`<b>${esc(x.n)}</b><span>${x.sc}</span><span>${x.ach}</span><span class="g${x.g}">${x.g}등급</span>`).join('')}</div>${r.report.why?`<p class="sub" style="margin:0">이번 성적의 근거</p><div class="chips">${r.report.why.map(w=>`<span class="chip ${w.good?'up':'down'}">${w.good?'▲':'▼'} ${esc(w.t)}</span>`).join('')}</div>`:''}<p class="src" style="margin:0">5등급제: 1등급 상위 10%, 2등급 34%, 3등급 66%, 4등급 90%까지. <a href="${SRC.grade[1]}">출처</a></p>`:'';
  return `${header()}${sceneSVG()}<div class="card">${dz}<p class="sub">${esc(r.dice&&!r.dice.same?'일어난 일: '+r.t:r.t)}</p><p class="ev">${esc(r.text||'그렇게 했어요.')}</p>${rp}
  ${r.chips&&r.chips.length?`<div class="chips">${r.chips.map(c=>`<span class="chip ${c.good?'up':'down'}">${esc(c.t)}</span>`).join('')}</div>`:''}</div>
  <button class="btn" data-a="next">${nx}</button>`;
}
function statCards(){
  const sc=(title,body,k)=>`<div class="card"><b>${title}</b><p class="sub">${body}</p><p class="src">출처: <a href="${SRC[k][1]}">${SRC[k][0]}</a></p></div>`;
  const out=[sc('실제 졸업생의 진로','2026년 직업계고 졸업자 중 49.2%는 대학에 진학했고, 25.7%는 취업했고, 20.3%는 취업도 진학도 하지 않았어요.','path'),
    sc('우리 지역',`${REG().name}의 직업계고 졸업자 취업률은 ${REG().rate}%예요(전국 ${NAT_RATE}%).`,'region')];
  if(S.grad==='pub')out.push(sc('좁은 문','공공기관 신규채용 중 고졸 비율은 2025년 1분기 8.3%였어요.','pub'));
  if(ROUTES[S.grad].job)out.push(sc('첫 직장에 남는 비율','직업계고 졸업 취업자 중 1년 뒤에도 일하고 있는 비율은 82.2%, 2년 뒤는 68.9%예요.','keep'));
  if(['major','big','special','nat'].includes(S.grad))out.push(sc('큰 회사 취업','직업계고 졸업 취업자 중 300명 이상 기업에 간 비율은 38.4%로 5년 연속 늘었어요.','size'));
  return out.join('');
}
function dreamLine(){const A=S.af,d=S.dream,job=S.track==='job';
  const ok={job:job&&A.mon>=24,uni:A.uniDone||A.dual||S.track==='uni',civil:job&&A.kind==='civil',pub:job&&A.kind==='pub',abroad:S.grad==='abroad',startup:S.track==='startup'}[d];
  if(d==='none')return `그때는 하고 싶은 게 없었어요. 5년이 지난 지금은 "${afJob()}"${jo(afJob(),'이에요','예요').slice(afJob().length)}.`;
  if(d==='startup'&&!ok&&A.past.some(p=>p.startsWith('창업')))return '내 가게를 차려 직접 부딪혀 봤어요. 그 경험이 다음 길의 밑천이 됐어요.';
  return ok?'중3 때 말한 꿈을 이뤘어요.':`꿈과는 다른 길을 걷고 있지만, 지금은 "${afJob()}"${jo(afJob(),'이에요','예요').slice(afJob().length)}.`;}
function friendRows(){const A=S.af,m=S.gender==='m';
  const ext=extOK();
  const rows=[['경력',yrs(A.mon)+(A.past.length?' (이직 포함)':''),ext?'1년 안팎 (바로 취업했다면)':'없음 (아르바이트)'],
   ['학력',afEdu(),ext?'4년제 졸업':m?'4년제 3~4학년 재학':'4년제 졸업'],
   ['지금',afJob(),ext?'대졸 신입 또는 취업 준비':m?'군 복무를 마치고 복학':'졸업 후 취업 준비']];
  if(m)rows.push(['병역',A.army||(A.inArmy?'복무 중':'미필'),'현역 만기 전역']);
  rows.push(['자격증',S.certs+'개','어학 점수 등 취업 준비']);
  return rows;}
function vEnding(){
  const R=ROUTES[S.grad],ach=achievements(),A=S.af,allC=S.hs.certs.concat(A.certs);
  return `<p class="lab">${extOK()?'졸업 6년 6개월 뒤 (군 복무 1년 6개월 포함)':'졸업 5년 뒤'} · ${S.age}세</p>
  <div class="card"><span class="tag" style="align-self:flex-start">${esc(trackLab())}</span><div class="big" style="font-size:24px">${esc(afJob())}</div>
  <div class="kv"><span>경력</span><b>${yrs(A.mon)}</b></div>
  ${A.title?`<div class="kv"><span>직급</span><b>${esc(A.title)}</b></div>`:''}
  <div class="kv"><span>학력</span><b>${esc(afEdu())}</b></div>
  ${S.gender==='m'?`<div class="kv"><span>병역</span><b>${esc(A.army||(A.inArmy?'복무 중':'아직 안 함'))}</b></div>`:''}
  <div class="kv"><span>자격증</span><b>${allC.length}개</b></div>${allC.length?`<p class="sub" style="margin-top:-4px">${allC.map(esc).join(', ')}</p>`:''}
  ${A.dual?'<p class="sub">일하면서 받은 경력과 대학 공부를 함께 쌓고 있어요. 특성화고를 졸업하고 3년 이상 일하면 재직자 특별전형으로 대학에 갈 수 있어요.</p>':''}</div>
  <p class="lab">중3 때의 꿈: ${esc(DREAMS[S.dream].name)}</p>
  <div class="card"><p class="ev">${esc(dreamLine())}</p></div>
  <p class="lab">같은 나이 인문계 친구와 비교</p>
  <div class="card"><div class="cmp"><span></span><span>나 (특성화고)</span><span>인문계 → 4년제 친구</span>${friendRows().map(r=>`<b>${r[0]}</b><span>${esc(r[1])}</span><span>${esc(r[2])}</span>`).join('')}</div>
  <p class="src" style="margin:0">${extOK()?'같은 시점(졸업 6년 6개월 뒤)의 친구예요. 친구도 군 복무를 마쳤어요. ':''}친구는 인문계고에서 4년제 대학에 바로 간 한 가지 예시예요. 실제로는 사람마다 길이 달라요.</p></div>
  <p class="lab">졸업 후 ${extOK()?'6년 6개월':'5년'} 동안</p>
  <div class="card">${A.got.length||A.past.length?`<div class="chips">${A.got.map(a=>`<span class="chip up">${esc(a)}</span>`).join('')}${A.past.map(a=>`<span class="chip">거쳐 온 곳 · ${esc(a)}</span>`).join('')}</div>`:'<p class="sub">큰 변화 없이 하루하루를 버텨 낸 5년이었어요.</p>'}</div>
  <p class="lab">졸업 진로</p>
  <div class="card"><span class="tag" style="align-self:flex-start">${R.name}</span><div class="big" style="font-size:22px">${esc(S.gradName)}</div><p class="sub">${R.desc}</p></div>
  <p class="lab">고교 3년 동안 이룬 것</p>
  <div class="card">${ach.length?`<div class="chips">${ach.map(a=>`<span class="chip up">${esc(a)}</span>`).join('')}</div>`:'<p class="sub">눈에 띄는 기록은 없지만, 3년을 끝까지 다닌 것도 해낸 일이에요.</p>'}
  ${S.offers.length?`<p class="src" style="margin:0">받은 합격 통지: ${S.offers.map(o=>esc(o.name)).join(', ')}</p>`:''}</div>
  ${resume()}
  <p class="lab">실제 통계와 비교</p>${statCards()}
  <p class="lab">공유</p>
  <div class="card"><p class="sub">친구가 이 링크를 열면 같은 지역·학과로 시작해 다른 선택을 해 볼 수 있어요.</p>
  <p style="font-variant-numeric:tabular-nums;margin:0"><b>#${shareCode()}</b></p>
  <button class="btn" data-a="copy">공유 링크 복사</button></div>
  <p class="lab">8년 기록</p>
  <div class="card log">${S.log.map(([s,t])=>`<div><span>${logLab(s)}</span><p style="margin:0">${esc(t)}</p></div>`).join('')}</div>
  <button class="btn" data-a="home">처음부터 다시</button>
  <button class="btn ghost" data-a="dex">진로 도감</button>`;
}
function vDex(){
  const d=store.get('lp4_dex')||{e:[],l:[]};
  return `<div class="top"><h2>진로 도감</h2><button class="link" data-a="back">닫기</button></div>
  <p class="lab">졸업 진로 ${d.e.length} / ${Object.keys(ROUTES).length}</p>
  <div class="dex">${Object.entries(ROUTES).map(([k,e])=>`<div class="${d.e.includes(k)?'':'off'}">${d.e.includes(k)?e.name:'???'}</div>`).join('')}</div>
  <p class="lab">이야기 줄기 ${d.l.length} / ${LINES.length}</p>
  <div class="dex">${LINES.map(l=>`<div class="${d.l.includes(l.id)?'':'off'}">${d.l.includes(l.id)?l.name:'???'}</div>`).join('')}</div>`;
}
function render(){
  const v=H.view==='dex'?'dex':!S||H.view==='home'?'home':S.screen;
  $('app').innerHTML={home:vHome,dex:vDex,intro:vIntro,card:vCard,result:vResult,ending:vEnding}[v]();
  save();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='set'){H[b.dataset.k]=v;render();}
  else if(a==='start'){newGame({seed:Math.floor(Math.random()*2147483647),gender:H.gender,dept:H.dm==='pick'?H.dept:null});H.view='game';render();}
  else if(a==='startShare'){newGame({...H.share});S.deptMode='share';H.share=null;H.view='game';try{history.replaceState(null,'',location.pathname+location.search);}catch(err){}render();}
  else if(a==='continue'){S=store.get('lp4_save');H.view='game';render();}
  else if(a==='go'){S.screen='card';render();}
  else if(a==='choose'){choose(+v);render();}
  else if(a==='next'){next();render();}
  else if(a==='dex'){H.prev=H.view;H.view='dex';render();}
  else if(a==='back'){H.view=H.prev&&H.prev!=='dex'?H.prev:'home';render();}
  else if(a==='home'){H.view='home';S=null;try{localStorage.removeItem('lp4_save');}catch(err){}render();}
  else if(a==='copy'){const url=location.href.split('#')[0]+'#'+shareCode();
    const done=t=>{b.textContent=t;};
    try{navigator.clipboard.writeText(url).then(()=>done('복사했어요'),()=>done('복사가 막혔어요. 위 코드를 주소 끝에 붙이세요'));}catch(err){done('복사가 막혔어요. 위 코드를 주소 끝에 붙이세요');}}
});
/* 시작 */
H.share=parseShare(location.hash);
{const sv=store.get('lp4_save');if(sv&&!sv.done&&sv.v===5&&!H.share){S=sv;H.view='game';}}
render();

</script>
</body>
</html>
